<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CML2 Console Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Overlay -->
  <div id="login-overlay" class="overlay">
    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#161b22"/>
          <path d="M10 24 L18 16 L18 32 Z" fill="#58a6ff"/>
          <path d="M22 14 L38 24 L22 34 Z" fill="#3fb950" opacity="0.8"/>
          <circle cx="10" cy="24" r="2.5" fill="#58a6ff"/>
          <circle cx="22" cy="14" r="2.5" fill="#3fb950"/>
          <circle cx="22" cy="34" r="2.5" fill="#3fb950"/>
          <circle cx="38" cy="24" r="2.5" fill="#d29922"/>
        </svg>
      </div>
      <h1>CML2 Console</h1>
      <p class="login-host" id="login-host">…</p>
      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="login-error" role="alert"></div>
        <button type="submit" id="login-btn" class="btn-primary">
          <span id="login-btn-text">Connect</span>
          <span id="login-spinner" class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none">
          <path d="M10 24 L18 16 L18 32 Z" fill="#58a6ff"/>
          <path d="M22 14 L38 24 L22 34 Z" fill="#3fb950" opacity="0.9"/>
          <circle cx="10" cy="24" r="2.5" fill="#58a6ff"/>
          <circle cx="22" cy="14" r="2.5" fill="#3fb950"/>
          <circle cx="22" cy="34" r="2.5" fill="#3fb950"/>
          <circle cx="38" cy="24" r="2.5" fill="#d29922"/>
        </svg>
        <span class="app-title">CML2 Console</span>
        <span class="host-badge" id="host-badge">…</span>
      </div>
      <div class="header-right">
        <button id="refresh-btn" class="btn-icon" title="Refresh labs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
        <button id="logout-btn" class="btn-icon" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Body -->
    <div class="body">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">LABS</span>
          <span id="lab-count" class="count-badge">0</span>
        </div>
        <div id="labs-tree" class="labs-tree">
          <div class="empty-state">
            <span class="spinner"></span>
            Loading…
          </div>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main">
        <!-- Tab bar -->
        <div id="tab-bar" class="tab-bar">
          <div id="tab-bar-empty" class="tab-bar-empty">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <polyline points="9 9 12 6 15 9"/>
              <line x1="12" y1="6" x2="12" y2="18"/>
            </svg>
            Select a booted device to open a console
          </div>
        </div>

        <!-- Terminal panes -->
        <div id="terminals" class="terminals">
          <div id="welcome-screen" class="welcome-screen">
            <div class="welcome-content">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#30363d" stroke-width="1.5">
                <polyline points="4 17 10 11 4 5"/>
                <line x1="12" y1="19" x2="20" y2="19"/>
              </svg>
              <h2>No active sessions</h2>
              <p>Expand a lab in the sidebar and click a <span class="badge-booted">BOOTED</span> device to open its console.</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <div id="status-text" class="status-text">Ready</div>
      <div id="active-sessions" class="active-sessions">0 active sessions</div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
